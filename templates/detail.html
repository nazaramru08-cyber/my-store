<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ produk.nama }} - Nexus Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

    <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-white">NEXUS<span class="text-cyan-400">TECH</span></a>
            <a href="/" class="text-xs text-slate-400 hover:text-white transition">&larr; Kembali ke Beranda</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-16 grid grid-cols-1 md:grid-cols-2 gap-12">
        <div>
            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-800 text-cyan-400 border border-slate-700">{{ produk.kategori }}</span>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white mt-4 mb-4">{{ produk.nama }}</h1>
            <p class="text-slate-400 leading-relaxed mb-6">{{ produk.deskripsi }}</p>
            
            <div class="mb-8">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-3">Spesifikasi Utama:</h3>
                <ul class="space-y-2">
                    {% for spesifikasi in produk.spesifikasi %}
                    <li class="flex items-center text-sm text-slate-300">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 mr-3"></span>
                        {{ spesifikasi }}
                    </li>
                    {% endfor %}
                </ul>
            </div>

            <div class="text-2xl font-extrabold text-cyan-400 mb-6">{{ produk.harga_str }}</div>
        </div>

        <!-- Form Pemesanan / Checkout -->
        <div class="bg-slate-900/60 border border-slate-800 p-8 rounded-2xl shadow-xl">
            <h3 class="text-lg font-bold text-white mb-4">Formulir Pemesanan Unit</h3>
            <form action="/checkout/{{ produk.id }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Nama Lengkap</label>
                    <input type="text" name="nama" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Alamat Pengiriman</label>
                    <textarea name="alamat" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500"></textarea>
                </div>
                <button type="submit" class="w-full py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition shadow-lg shadow-cyan-500/20">
                    Konfirmasi Pesanan
                </button>
            </form>
        </div>
    </main>

</body>
</html>
